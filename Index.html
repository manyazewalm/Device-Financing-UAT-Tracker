<!DOCTYPE html>
<html>
<head>
  <title>Device Financing UAT Portal</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    iframe {
      width: 90%;   /* adds left/right margin */
      height: 95%;  /* keeps some spacing at top/bottom */
      border: none;
    }
  </style>
</head>
<body>
  <iframe src="https://script.google.com/macros/s/AKfycbwJvxtRh9_VvxCe19q-799gucIoen0qU2efTkfU5_w3QNLpOFomx-ZpNR9Wku6PVS3R/exec"
          allowfullscreen="true"></iframe>
  <script>
    window.onload = function() {
      const iframe = document.querySelector('iframe');
      iframe.requestFullscreen().catch((err) => {
        console.error("Error attempting to enable full-screen mode: " + err.message);
      });
    };
  </script>
</body>
</html>
